{% extends "base.html" %}
{% load static %}
{% block main %}
<div class="row">
    <div class="col-sm-8 mx-auto">
        <div class="card text-bg-dark" style="height: 655px;">
            <img src="{% static 'img/book1.webp' %}" class="card-img" alt="...">
            <div class="card-img-overlay">
                <h1 class="card-title fw-bold">Register</h1>
                {% if messages %}
                {% for m in messages %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    {{m}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="exampleInputName" class="form-label">
                            <h6>First Name</h6>
                        </label>
                        <input type="text " name="name" class="form-control" id="exampleInputName"
                            aria-describedby="NameHelp">

                        <div class="mb-3">
                            <label for="exampleInputName" class="form-label">
                                <h6>contactno</h6>
                            </label>
                            <input type="text" name="contactno" class="form-control" id="exampleInputName"
                                aria-describedby="NameHelp">

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">
                                    <h6>Email address</h6>
                                </label>
                                <input type="email" name="email" class="form-control" id="exampleInputEmail1"
                                    aria-describedby="emailHelp">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">
                                    <h6>Password</h6>
                                </label>
                                <input type="password" name="password" class="form-control" id="exampleInputPassword1">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">
                                    <h6>Conform Password</h6>
                                </label>
                                <input type="password" name="cpassword" class="form-control" id="exampleInputPassword1">
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <h2>Register</h2>
                            </button>
                            <p class="text-center">I have already account <a href="{% url 'login' %}">login</a></p>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
