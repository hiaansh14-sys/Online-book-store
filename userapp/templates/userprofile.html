{% extends 'userbase.html' %}
{% load static %}
{% block user %}

<div class="row">
    <div class="col-sm-12">
        <h3>user profile</h3>
    </div>
    <div class="col-sm-4 mx-auto">
        <div class="card shadow mt-4 p-4">
        <div class="text_center">
            {% if user.picture %}
            <img src="{{user.picture.url}}" alt="" class="rounded-circle" height="200px">
            {% else %}
            <img src="{% static 'img/default.jpg' %}" alt="" class="rounded-circle" height="200px">
            {% endif %}
        </div>
        <hr>
        <h5 class="text-center">Name</h5>
        <p>
            <b>Email:</b>{{user.email}}<br>
            <b>Contact No:</b>{{user.contact}}<br>
            <b>Address:</b>{% if user.address%} {{user.address}} {%else%} Not updated {% endif %}<br>
        </p>
        <hr>
        <div class="text-center">
            <a href="{% url 'editprofile' %}" class="btn btn-primary btn-sm"><i class="ti ti-edit"></i>editprofile</a>
        </div>
    </div>
    </div>
    
</div>
{% endblock %}
