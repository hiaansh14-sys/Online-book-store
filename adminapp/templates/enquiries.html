{% extends 'adminbase.html'%}
{% block admin%}
<div class="row">
    <div class="col-sm-12">
        <h3>Please enquiries</h3>
        <table class="table table-striped">
            <tr>
                <th>S.no</th>
                <th>Name</th>
                <th>Email</th>
                <th>Contact No</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Enquiry Date</th>
                <th>Action</th>
            </tr>
            {% for e in enqs %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{e.name}}</td>
                <td>{{e.email}}</td>
                <td>{{e.contactno}}</td>
                <td>{{e.subject}}</td>
                <td>{{e.message}}</td>
                <td>{{e.enqdate}}</td>
                <td><a href="#" class="btn btn-danger"><i class="ti ti-trash"></i></a></td>
            </tr>
            
            </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
